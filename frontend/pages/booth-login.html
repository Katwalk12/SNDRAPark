<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNDRA Park | Booth Login</title>
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/images/favicon.png">
  <script>
    (function () {
      const pathName = String(window.location.pathname || "");
      const frontendIndex = pathName.indexOf("/frontend/");
      const backendIndex = pathName.indexOf("/backend/");
      const splitIndex = frontendIndex >= 0 ? frontendIndex : backendIndex;
      const projectBasePath = splitIndex >= 0 ? pathName.slice(0, splitIndex).replace(/\/+$/, "") : "";
      window.__SNDRA_PROJECT_BASE_PATH = projectBasePath;
      const base = document.createElement("base");
      base.href = `${projectBasePath}/frontend/pages/`;
      document.head.appendChild(base);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/design-system.css?v=20260824-ds1">
  <link rel="stylesheet" href="../css/booth-login.css">
  <link rel="stylesheet" href="../css/auth.refine.css?v=20260824-ds1">
</head>
<body>
  <main class="staff-auth-shell">
    <section class="staff-auth-panel">
      <div class="panel-content">
        <a class="back-home" href="./index.html">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          <span>Back Home</span>
        </a>

        <div class="brand-mark">
          <img class="brand-logo-image" src="../../assets/images/brand-mark.png" alt="SNDRA Park logo">
        </div>

        <div class="auth-copy">
          <p class="section-kicker">Parking Booth</p>
          <h1>Teller PIN Access</h1>
          <p class="auth-subtitle">Enter your booth teller PIN to open the realtime scanner and payment console.</p>
        </div>

        <form id="booth-login-form" method="post" class="staff-auth-form" novalidate>
          <div class="pin-panel" aria-label="PIN code entry">
            <label class="pin-label" for="booth-pin">PIN Code</label>
            <input id="booth-pin" name="pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="4" aria-describedby="booth-login-status">
            <div class="pin-display" id="booth-pin-display" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

          <div class="pin-keypad" aria-label="Numeric keypad">
            <button type="button" data-pin-key="1">1</button>
            <button type="button" data-pin-key="2">2</button>
            <button type="button" data-pin-key="3">3</button>
            <button type="button" data-pin-key="4">4</button>
            <button type="button" data-pin-key="5">5</button>
            <button type="button" data-pin-key="6">6</button>
            <button type="button" data-pin-key="7">7</button>
            <button type="button" data-pin-key="8">8</button>
            <button type="button" data-pin-key="9">9</button>
            <button class="keypad-secondary" type="button" data-pin-action="clear">Clear</button>
            <button type="button" data-pin-key="0">0</button>
            <button class="keypad-secondary" type="button" data-pin-action="backspace" aria-label="Delete last digit">
              <i class="bi bi-backspace" aria-hidden="true"></i>
            </button>
          </div>

          <button class="primary-btn" type="submit">Unlock Booth Console</button>
          <p class="form-status" id="booth-login-status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="../../assets/js/runtime-config.js?v=20260830-attrib1"></script>
  <script src="../../assets/js/system-settings.js?v=20260829-title1"></script>
  <script src="../js/booth-login.js?v=20260525-pin"></script>
</body>
</html>
