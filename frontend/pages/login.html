<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNDRA Park | Login</title>
  <script>
    (function () {
      const pathName = String(window.location.pathname || "");
      const frontendIndex = pathName.indexOf("/frontend/");
      const backendIndex = pathName.indexOf("/backend/");
      const splitIndex = frontendIndex >= 0 ? frontendIndex : backendIndex;
      const projectBasePath = splitIndex >= 0 ? pathName.slice(0, splitIndex).replace(/\/+$/, "") : "";
      window.__SNDRA_PROJECT_BASE_PATH = projectBasePath;
      const base = document.createElement("base");
      base.href = `${projectBasePath}/frontend/pages/`;
      document.head.appendChild(base);
    })();
  </script>
  <link rel="icon" type="image/jpeg" href="../assets/icons/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-media" aria-label="Parking garage background image">
      <a class="brand-mark" href="./login.html" aria-label="SNDRA Park login page">
        <img class="brand-logo-image" src="../assets/icons/logo.jpg" alt="SNDRA Park logo">
      </a>
    </section>

    <section class="auth-panel">
      <div class="panel-star" aria-hidden="true">
        <svg viewBox="0 0 120 48" role="presentation">
          <path d="M4 24H84"></path>
          <path d="M92 8V40"></path>
          <path d="M84 16L102 24L84 32"></path>
          <path d="M92 8L100 0"></path>
          <path d="M92 40L100 48"></path>
        </svg>
      </div>

      <div class="panel-content">
        <a class="back-home" href="./index.html">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          <span>Back Home</span>
        </a>

        <div class="auth-copy">
          <h1>Welcome back.</h1>
          <p class="auth-subtitle">Sign in to reserve your parking slot faster.</p>
        </div>

        <form id="login-form" class="auth-form" data-auth-form data-redirect="./user-dashboard.html" novalidate>
          <div class="field-group floating-field">
            <label class="floating-label" for="login-email">Email</label>
            <input class="auth-input" id="login-email" name="email" type="email" placeholder=" " autocomplete="email" data-validate="required|email">
            <p class="field-error" data-error-for="email"></p>
          </div>

          <div class="field-group floating-field password-field">
            <label class="floating-label" for="login-password">Password</label>
            <input class="auth-input" id="login-password" name="password" type="password" placeholder=" " autocomplete="current-password" data-validate="required">
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-toggle data-target="login-password">
              <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"></path>
                <circle cx="12" cy="12" r="3.2"></circle>
              </svg>
              <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.7 5.2A9.5 9.5 0 0 1 12 5c6.5 0 10.5 7 10.5 7a18 18 0 0 1-3.2 3.8"></path>
                <path d="M6.3 6.3A18 18 0 0 0 1.5 12S5.5 19 12 19c1.5 0 2.8-.3 4-.8"></path>
                <path d="M9.9 9.9A3.2 3.2 0 0 0 14.1 14.1"></path>
              </svg>
            </button>
            <p class="field-error" data-error-for="password"></p>
          </div>

          <div class="inline-meta">
            <span></span>
            <a class="text-link forgot-link" href="../../forgot-password.php">Forgot Password?</a>
          </div>

          <div class="divider" aria-hidden="true">
            <span>Or</span>
          </div>

          <button class="action-btn google-btn" type="button" data-demo-action="google">
            <span>Continue using Google</span>
            <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.3-1.7 3.9-5.4 3.9-3.2 0-5.9-2.7-5.9-6s2.7-6 5.9-6c1.8 0 3 .8 3.7 1.4l2.5-2.4C16.6 3.5 14.6 2.7 12 2.7A9.3 9.3 0 0 0 2.7 12c0 5.2 4.1 9.3 9.3 9.3 5.4 0 9-3.8 9-9.1 0-.6-.1-1.1-.2-1.5H12Z"></path>
              <path fill="#34A853" d="M2.7 16.3l3.2-2.5c.8 2.1 2.8 3.6 6.1 3.6 3.5 0 4.9-2.4 5.4-3.6l3.2 2.5c-1.9 3.7-5.5 5-8.6 5-5.2 0-9.3-4.1-9.3-9.3 0 1.5.4 3 .9 4.3Z"></path>
              <path fill="#4A90E2" d="M20.8 10.5H12v3.9h5.4c-.3 1.2-1.2 2.2-2.4 2.9l3.2 2.5c1.9-1.7 3-4.2 3-7.8 0-.6-.1-1.1-.4-1.5Z"></path>
              <path fill="#FBBC05" d="M5.9 13.8A5.9 5.9 0 0 1 5.6 12c0-.6.1-1.2.3-1.8L2.7 7.7A9.3 9.3 0 0 0 2 12c0 1.5.4 3 .7 4.3l3.2-2.5Z"></path>
            </svg>
          </button>

          <button class="action-btn primary-btn" type="submit">Log In</button>

          <p class="form-status" data-form-status aria-live="polite"></p>
          <p class="switch-copy">Don&apos;t have an account? <a class="text-link animated-link" href="./signup.html">Sign Up</a></p>
        </form>
      </div>
    </section>

    <div class="flow-lines" aria-hidden="true">
      <svg viewBox="0 0 420 960" preserveAspectRatio="none" role="presentation">
        <defs>
          <path id="flow-curve" d="M368 -48C216 112 190 302 250 480C321 662 309 812 178 1008"></path>
        </defs>
        <use href="./login.html#flow-curve" x="0"></use>
        <use href="./login.html#flow-curve" x="-14"></use>
        <use href="./login.html#flow-curve" x="-28"></use>
        <use href="./login.html#flow-curve" x="-42"></use>
        <use href="./login.html#flow-curve" x="-56"></use>
        <use href="./login.html#flow-curve" x="-70"></use>
        <use href="./login.html#flow-curve" x="-84"></use>
        <use href="./login.html#flow-curve" x="-98"></use>
        <use href="./login.html#flow-curve" x="-112"></use>
        <use href="./login.html#flow-curve" x="-126"></use>
        <use href="./login.html#flow-curve" x="-140"></use>
        <use href="./login.html#flow-curve" x="-154"></use>
        <use href="./login.html#flow-curve" x="-168"></use>
        <use href="./login.html#flow-curve" x="-182"></use>
      </svg>
    </div>
  </main>

  <script src="../../assets/js/runtime-config.js"></script>
  <script src="../../assets/js/system-settings.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
