<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNDRA Park | Admin Login</title>
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/images/favicon.png">
  <script>
    (function () {
      const pathName = String(window.location.pathname || "");
      const frontendIndex = pathName.indexOf("/frontend/");
      const backendIndex = pathName.indexOf("/backend/");
      const splitIndex = frontendIndex >= 0 ? frontendIndex : backendIndex;
      const projectBasePath = splitIndex >= 0 ? pathName.slice(0, splitIndex).replace(/\/+$/, "") : "";
      window.__SNDRA_PROJECT_BASE_PATH = projectBasePath;
      const base = document.createElement("base");
      base.href = `${projectBasePath}/frontend/pages/`;
      document.head.appendChild(base);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css?v=20260926-palette1">
  <link rel="stylesheet" href="../css/admin-login.css?v=20260926-palette1">
  <link rel="stylesheet" href="../css/auth.refine.css?v=20260926-palette1">
  <link rel="stylesheet" href="../css/responsive.css?v=20260926-palette1">
</head>
<body>
  <main class="staff-auth-shell">
    <section class="staff-auth-panel">
      <div class="panel-content">
        <div class="auth-copy">
          <p class="section-kicker">SNDRA Park</p>
          <h1>Administrator sign in</h1>
        </div>

        <form id="admin-login-form" method="post" class="staff-auth-form" novalidate>
          <div class="field-group">
            <label for="admin-email">Email</label>
            <input id="admin-email" name="email" class="auth-input" type="email" autocomplete="username" autofocus>
          </div>

          <div class="field-group">
            <label for="admin-password">Password</label>
            <input id="admin-password" name="password" class="auth-input" type="password" autocomplete="current-password">
          </div>

          <!-- Tripwire. Not type="hidden": scripted clients skip those, and
               the point is to be found by something that walks the form.
               Hidden from sight, from the tab order, and from assistive
               technology, so no person can put anything in it -- anything that
               arrives filled came from a script. See backend/admin/security-trap.php. -->
          <div class="trap-field" aria-hidden="true">
            <label for="admin-notes-hp">Leave this field empty</label>
            <input id="admin-notes-hp" name="admin_notes_hp" type="text" tabindex="-1" autocomplete="off">
          </div>

          <button class="primary-btn" type="submit">Sign in</button>

          <p class="form-status" id="admin-login-status" aria-live="polite"></p>
        </form>

        <a class="back-home" href="./index.html">Back to main page</a>
      </div>
    </section>
  </main>

  <!-- Raised only after the server accepts the password and asks for the
       emailed code. The backdrop blurs the form behind it so the half-finished
       sign-in is visibly on hold rather than still waiting for input. -->
  <div class="two-factor-modal" id="admin-2fa-modal" hidden>
    <div class="two-factor-modal__backdrop" data-2fa-dismiss></div>

    <section class="two-factor-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="admin-2fa-title">
      <button class="two-factor-modal__close" id="admin-2fa-cancel" type="button" aria-label="Cancel sign-in">&times;</button>

      <p class="section-kicker">Two-step verification</p>
      <h2 id="admin-2fa-title">Enter your 6-digit code</h2>
      <p class="two-factor-modal__hint" id="admin-2fa-hint">We emailed a code to your administrator address.</p>

      <div class="field-group">
        <label for="admin-2fa-code">6-digit code</label>
        <input class="auth-input code-input" id="admin-2fa-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
      </div>

      <button class="primary-btn" id="admin-2fa-submit" type="button">Verify and sign in</button>

      <!-- The login form's own status line is behind the blur, so the dialog
           carries its own. -->
      <p class="form-status" id="admin-2fa-status" aria-live="polite"></p>
    </section>
  </div>

  <script src="../../assets/js/runtime-config.js?v=20260830-attrib1"></script>
  <script src="../../assets/js/system-settings.js?v=20260829-title1"></script>
  <script src="../js/admin-login.js?v=20260901-minimal1"></script>
</body>
</html>
